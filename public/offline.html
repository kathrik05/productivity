<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />
    <title>Offline - Productivity</title>
    <style>
      body {
        margin: 0;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        background-color: #ffffff;
        color: #171717;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      p {
        font-size: 14px;
        color: #4d4d4d;
        max-width: 310px;
        margin-bottom: 24px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: #f3562b;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        padding: 12px 24px;
        min-height: 44px;
      }
    </style>
  </head>
  <body>
    <h1>You are offline</h1>
    <p>Your saved tasks and lists are available offline inside the app.</p>
    <a href="/">Open App</a>
  </body>
</html>
